.lf-row input[type=range]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 1px rgba(10,10,13,.9), 0 0 0 4px rgba(111,180,201,.55); }

.lf-color-row { display: flex; align-items: center; gap: 8px; }
.lf-color-row input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid rgba(255,255,255,0.12);
  border-radius: 6px; background: none; cursor: pointer; flex: none; }
.lf-hex { font: 12px ui-monospace,Menlo,monospace; color: #c9c9d4; text-transform: uppercase; }

.lf-segmented { display: flex; gap: 6px; margin-bottom: 8px; }
.lf-seg-btn { flex: 1; background: #141419; color: #8a8a9a; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px; padding: 7px 8px; font: 11px -apple-system,sans-serif; cursor: pointer;
  display: flex; align-items: center; gap: 6px; justify-content: center; }
.lf-seg-btn::before { content: ''; width: 9px; height: 9px; border-radius: 50%; border: 1px solid #55556a; flex: none; }
.lf-seg-btn.lf-seg-btn-active { color: #e8e8e8; border-color: #437057; }
.lf-seg-btn.lf-seg-btn-active::before { border-color: #437057; background: #437057; }
.lf-visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Sticky footer (fix round 1, finding 1): a flex sibling of .lf-body, not a
   child of it, so it never scrolls with the sections above it. Its own
   background covers content scrolling underneath; its top border is the
   hairline that reads it as a footer rather than a floating button. */
.lf-reset { flex: none; width: 100%; box-sizing: border-box; margin: 0; background: #0b0b0f;
  color: #e8e8e8; border: none; border-top: 1px solid rgba(255,255,255,0.08);
  border-radius: 0 0 16px 16px; padding: 12px 18px; cursor: pointer;
  font: 11px -apple-system,sans-serif; }
.lf-reset:hover { background: #141419; }
.lf-presets { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 14px; }
.lf-chip { flex: 1 1 auto; background: #141419; color: #c9c9d4; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px; padding: 5px 6px; font: 500 10px/1 ui-monospace,Menlo,monospace;
  letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
.lf-chip:hover { color: #fff; border-color: #55556a; }
.lf-chip[aria-pressed="true"] { background: #437057; color: #e8e8e8; border-color: #437057; }
.lf-chip:focus-visible { outline: 2px solid #6fb4c9; outline-offset: 1px; }

/* Below ~640px: full-width sheet docked to the bottom edge, collapsed to a
   handle by default so the artwork stays unobstructed. This is scoped
   entirely to the media query and a separate in-memory flag — never the
   persisted desktop 'collapsed' state — so it can't leak into desktop. */
.lf-handle { display: none; }
@media (max-width: 640px) {
  .lf-panel { left: 0; right: 0; bottom: 0; width: 100%; max-height: 70vh;
    border-radius: 16px 16px 0 0; border-bottom: none; }
  .lf-handle { display: flex; flex: none; justify-content: center; padding: 8px 0; cursor: pointer; }
  .lf-handle::before { content: ''; width: 36px; height: 4px; border-radius: 999px; background: #3a3a46; }
  .lf-reset { border-radius: 0; }
  .lf-panel.mobile-collapsed .lf-body,
  .lf-panel.mobile-collapsed .lf-reset { display: none; }
}
`;

function kindOf(spec) {
  if (spec.type === 'checkbox') return 'boolean';
  if (spec.type === 'color') return 'color';
  if (spec.type === 'select') return 'enum';
  if (spec.type === 'hidden') return 'hidden';
  return 'number';
}

function injectCss() {
  if (document.getElementById('lf-panel-css')) return;
  const style = document.createElement('style');
  style.id = 'lf-panel-css';
  style.textContent = PANEL_CSS;
  document.head.appendChild(style);
}

function createControlPanel({ pieceId, onChange, extraControls = [], defaults: defaultOverrides = {}, presets = {} }) {
  injectCss();

  // Gallery preview iframes load pieces with ?preview=1: same-origin means
  // they'd otherwise read (and, on interaction, overwrite) the viewer's own
  // localStorage:<pieceId> — showing a hovered card's saved tuning instead
  // of its defaults. Under this flag we neither read nor write it. A piece
  // opened directly, with no query string, is completely unaffected.
  const isPreview = new URLSearchParams(location.search).get('preview') === '1';

  const storageKey = `linefield:${pieceId}`;
  const allSpecs = [...SHARED_CONTROLS, ...extraControls];
  const specByName = {};
  // kind is the discriminant every gate must branch on, never `type`: a gate
  // that switches on the type-name string would silently fall a new type
  // into whichever branch it doesn't match. 'hidden' (hue/hueB) has no panel
  // row at all and is excluded from control gates entirely — it is not a
  // user-facing control, just the exact numeric value colorA/colorB drive.
  for (const spec of allSpecs) {
    spec.kind = kindOf(spec);
    specByName[spec.name] = spec;
  }
  const defaults = {};
  for (const spec of allSpecs) {
    defaults[spec.name] = spec.name in defaultOverrides ? defaultOverrides[spec.name] : spec.default;
  }

  let saved = {};
  if (!isPreview) {
    try {
      saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
    } catch {
      saved = {};
    }
  }

  const values = { ...defaults, ...saved.values };
  // Saved values bypass setValue(), so validate enum membership on load.
  // An option removed or renamed since the save falls back to the control's
  // resolved default, keeping the rendered select and values in sync.
  for (const spec of allSpecs) {
    if (spec.kind === 'enum' && !spec.options.includes(values[spec.name])) {
      values[spec.name] = defaults[spec.name];
    }
  }
  let collapsed = saved.collapsed || false;
  let panelPosition = saved.position && Number.isFinite(saved.position.left) && Number.isFinite(saved.position.top)
    ? saved.position
    : null;
  // Mobile-sheet collapse is a separate, unpersisted flag: it starts
  // collapsed every load (handle-only, per the brief) and is scoped to the
  // <=640px media query in CSS, so toggling it can never affect (or be
  // affected by) the desktop `collapsed` state above.
  let mobileCollapsed = true;
  // Fix round 1, finding 2: sections collapse independently, persisted
  // alongside `collapsed`/`values`. Interactions starts open (the thing the
  // separation was for); Color and Visual start closed, so the panel fits
  // on screen at rest. `saved.sections ?? {}` is deliberately defensive — a
  // blob written before this change has no `sections` key at all, and
  // reading it without the fallback would throw on spread below.
  const DEFAULT_SECTION_OPEN = { interaction: true, color: false, visual: false };
  const sectionOpen = { ...DEFAULT_SECTION_OPEN, ...(saved.sections ?? {}) };

  const panel = document.createElement('div');
  panel.className = 'lf-panel mobile-collapsed' + (collapsed ? ' collapsed' : '');
  panel.setAttribute('data-lf-panel', '');

  // Mobile-only drag handle (CSS hides it above the breakpoint). Tapping it
  // expands/collapses the bottom sheet without touching desktop's own
  // click-to-collapse heading below.
  const handle = document.createElement('div');
  handle.className = 'lf-handle';
  handle.addEventListener('click', () => {
    mobileCollapsed = !mobileCollapsed;
    panel.classList.toggle('mobile-collapsed', mobileCollapsed);
  });
  panel.appendChild(handle);

  const heading = document.createElement('h3');
  const headingLabel = document.createElement('span');
  headingLabel.textContent = 'Controls';
  const status = document.createElement('span');
  status.className = 'lf-status';
  status.innerHTML = '<span class="lf-dot"></span>live';
  heading.append(headingLabel, status);
  heading.title = 'Drag to move · click to collapse';
  let dragState = null;
  let suppressHeadingClick = false;
  heading.addEventListener('pointerdown', (event) => {
    if (event.button !== 0 || window.innerWidth <= 640) return;
    const rect = panel.getBoundingClientRect();
    dragState = { id: event.pointerId, startX: event.clientX, startY: event.clientY, left: rect.left, top: rect.top, moved: false };
    heading.setPointerCapture(event.pointerId);
  });
  heading.addEventListener('pointermove', (event) => {
    if (!dragState || event.pointerId !== dragState.id) return;
    const dx = event.clientX - dragState.startX;
    const dy = event.clientY - dragState.startY;
    if (!dragState.moved && Math.hypot(dx, dy) < 4) return;
    dragState.moved = true;
    const maxLeft = Math.max(0, window.innerWidth - panel.offsetWidth);
    const maxTop = Math.max(0, window.innerHeight - panel.offsetHeight);
    panel.style.left = `${Math.min(maxLeft, Math.max(0, dragState.left + dx))}px`;
    panel.style.top = `${Math.min(maxTop, Math.max(0, dragState.top + dy))}px`;
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
  });
  function finishPanelDrag(event) {
    if (!dragState || event.pointerId !== dragState.id) return;
    if (heading.hasPointerCapture(event.pointerId)) heading.releasePointerCapture(event.pointerId);
    if (dragState.moved) {
      panelPosition = { left: parseFloat(panel.style.left), top: parseFloat(panel.style.top) };
      suppressHeadingClick = true;
      persist();
    }
    dragState = null;
  }
  heading.addEventListener('pointerup', finishPanelDrag);
  heading.addEventListener('pointercancel', finishPanelDrag);
  heading.addEventListener('click', () => {
    if (suppressHeadingClick) {
      suppressHeadingClick = false;
      return;
    }
    collapsed = !collapsed;
    panel.classList.toggle('collapsed', collapsed);
    persist();
  });
  panel.appendChild(heading);

  const body = document.createElement('div');
  body.className = 'lf-body';
  panel.appendChild(body);

  // The panel configures artwork visuals: camera angles in Interactions,
  // palette in Color, and the remaining rendering parameters in Visual.
  // Each section is a toggle-button header plus a body a category routes
  // rows into — `sectionOf` below is the single place that mapping lives.
  // Collapsing hides `.lf-section-body` via CSS only: rows stay in the DOM
  // (never removed), so a gate that drives a control by name or by
  // `row.querySelector` still finds it whether its section is open or not.
  function makeSection(key, title) {
    const section = document.createElement('div');
    section.className = 'lf-section';

    const headBtn = document.createElement('button');
    headBtn.type = 'button';
    headBtn.className = 'lf-section-head';
    const headLabel = document.createElement('span');
    headLabel.textContent = title;
    const chevron = document.createElement('span');
    chevron.className = 'lf-chevron';
    headBtn.append(headLabel, chevron);

    const sectionBody = document.createElement('div');
    sectionBody.className = 'lf-section-body';
    section.append(headBtn, sectionBody);

    function applyOpenState() {
      const open = sectionOpen[key];
      headBtn.setAttribute('aria-expanded', String(open));
      section.classList.toggle('lf-section-collapsed', !open);
    }
    applyOpenState();
    headBtn.addEventListener('click', () => {
      sectionOpen[key] = !sectionOpen[key];
      applyOpenState();
      persist();
    });

    return { el: section, body: sectionBody };
  }
  const secInteraction = makeSection('interaction', 'Interactions');
  const secColor = makeSection('color', 'Color');
  const secVisual = makeSection('visual', 'Visual');
  body.appendChild(secInteraction.el);
  body.appendChild(document.createElement('hr')).className = 'lf-divider';
  body.appendChild(secColor.el);
  body.appendChild(secVisual.el);

  // category is optional and defaults to 'visual'. Only 'interaction' and
  // 'color' route a control out of Visual — 'motion'/'form'/'ink' (the
  // piece-extra sub-tags called out in the brief) are metadata for a future
  // stage and land in Visual today, same as an uncategorised control.
  function sectionOf(spec) {
    if (spec.category === 'interaction') return secInteraction.body;
    if (spec.category === 'color') return secColor.body;
    return secVisual.body;
  }

  // Per-control render hook. Covers <input type=range|checkbox|color> and
  // <select> uniformly; a future widget that isn't a bare input/select would
  // register its own render(v) instead, so setValue below stays agnostic to
  // what is actually on screen.
  const controllers = {};

  // Clamp to the spec's declared range where numeric, then snap to its step
  // the same way <input type=range> snaps on a programmatic .value set. That
  // browser-side snap is exactly what the old DOM round-trip captured (set
  // .value, then read it back post-sanitization); setValue writes values[]
  // directly and never reads the DOM back, so without this step a control's
  // displayed slider position and its rendered value can disagree — the
  // Pitch/Yaw divergence this stage exists to remove, reintroduced. Not
  // applied to booleans (kind === 'boolean') or to a name with no known spec.
  function clampValue(spec, v) {
    // Enum membership is not optional: a value outside spec.options must be
    // rejected rather than written, or __LF_VALUES__ and the rendered <select>
    // diverge (the <select> silently ignores an out-of-range .value while
    // the state object keeps whatever was passed in). Falls back to the
    // control's current value, the same "previous value stands" rule a
    // number's clamp already applies at its min/max.
    if (spec?.kind === 'enum') {
      return spec.options.includes(v) ? v : values[spec.name];
    }
    if (!spec || spec.kind !== 'number' || typeof spec.min !== 'number' || typeof spec.max !== 'number') {
      return v;
    }
    const clamped = Math.min(spec.max, Math.max(spec.min, v));
    const step = Number(spec.step);
    if (!(step > 0)) return clamped;
    const snapped = spec.min + Math.round((clamped - spec.min) / step) * step;
    const decimals = (String(step).split('.')[1] || '').length;
    return decimals ? Number(snapped.toFixed(decimals)) : snapped;
  }

  // THE write path. Every value change — a drag, a preset, Reset, or a gate
  // script driving the panel with no DOM at all — goes through this and only
  // this, so a value set by an audit renders identically to the same value
  // set by a human: clamp -> write -> render -> clear active chip -> fire
  // onChange exactly once -> persist if asked.
  function setValue(name, value, { persist: shouldPersist = true } = {}) {
    const spec = specByName[name];
    const v = clampValue(spec, value);
    values[name] = v;
    // A colour control's spec names the hidden numeric field it drives
    // (colorA -> hue, colorB -> hueB). This is the ONLY place that hex gets
    // decoded — once per pick, never in a render loop — and it never runs
    // for a programmatic write to the hidden field itself (see applyValues,
    // which reasserts hue/hueB after this fires so a preset/reset always
    // lands on the exact declared number, not a lossy decode of colorA/
    // colorB). An achromatic pick (grey/white/black) has no hue to extract;
    // hexToHue returns null and the previous hue is left untouched.
    if (spec?.linkedHue) {
      const decoded = hexToHue(v);
      if (decoded !== null) values[spec.linkedHue] = decoded;
    }
    controllers[name]?.render(v);
    if (name === 'colorMode') controllers.colorB?.setRowVisible?.(v === 'gradient');
    setActiveChip(null);
    onChange(name, v, values);
    if (shouldPersist) persist();
  }

  // Same decimals rule clampValue's step-snap uses, so a slider's readout
  // never shows more precision than the control itself actually holds.
  function formatNumber(spec, v) {
    const decimals = (String(spec.step).split('.')[1] || '').length;
    return decimals ? Number(v).toFixed(decimals) : String(v);
  }

  // Mock 2's slider fill is a gradient over the FILLED portion only, unfilled
  // remainder flat grey — not achievable in pure CSS for a native <input
  // type=range> (no fill-percentage selector exists), so render() also
  // writes this custom property every time a value changes, human-dragged or
  // gate-driven, and the two-stop `background-size` trick in PANEL_CSS reads it.
  function setRangeFill(input, spec, v) {
    const pct = spec.max > spec.min ? ((v - spec.min) / (spec.max - spec.min)) * 100 : 0;
    input.style.setProperty('--lf-pct', `${pct}%`);
  }

  // Mock 2's "(•) Solid ( ) Gradient" radio pair, without a second real
  // <input> in colorMode's row: the row's one real control stays the
  // <select> buildRow already built (kept in the DOM, driven exactly the way
  // test-interactions.mjs dispatches a real DOM `input` event), visually
  // hidden, with a composite pair of buttons layered in front of it that
  // call setValue the same way any other control does. This is the
  // registration hook, not a second write path: the buttons never touch
  // `values` themselves.
  function enhanceColorModeToggle(row, select, spec) {
    select.classList.add('lf-visually-hidden');
    const seg = document.createElement('div');
    seg.className = 'lf-segmented';
    const buttons = {};
    for (const opt of spec.options) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'lf-seg-btn';
      btn.textContent = opt.charAt(0).toUpperCase() + opt.slice(1);
      btn.addEventListener('click', () => setValue(spec.name, opt));
      buttons[opt] = btn;
      seg.appendChild(btn);
    }
    row.insertBefore(seg, select);
    const baseRender = controllers[spec.name].render;
    controllers[spec.name].render = (v) => {
      baseRender(v);
      for (const [opt, btn] of Object.entries(buttons)) btn.classList.toggle('lf-seg-btn-active', opt === v);
    };
    controllers[spec.name].render(values[spec.name]);
  }

  function buildRow(spec) {
    // 'hidden' (hue/hueB) is not a control — no row, no input, no DOM at all.
    // It stays in allSpecs/defaults/values so the rest of the machinery
    // (defaults composition, presets, persistence) treats it like any other
    // value; it is simply never rendered or driven directly.
    if (spec.type === 'hidden') return;

    const row = document.createElement('div');
    row.className = 'lf-row';
    let input;
    let readoutEl = null;
    let hexEl = null;

    if (spec.type === 'checkbox') {
      // Compact single line — label and box side by side, matching mock 2's
      // "Invert [ ]" — rather than the label-above-control layout every
      // other control below uses.
      row.classList.add('lf-row-checkbox');
      const label = document.createElement('label');
      label.textContent = spec.label;
      input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = !!values[spec.name];
      row.append(label, input);
    } else {
      const head = document.createElement('div');
      head.className = 'lf-row-head';
      const label = document.createElement('label');
      label.textContent = spec.label;
      head.appendChild(label);

      if (spec.type === 'color') {
        input = document.createElement('input');
        input.type = 'color';
        input.value = values[spec.name];
        row.appendChild(head);
        const colorRow = document.createElement('div');
        colorRow.className = 'lf-color-row';
        hexEl = document.createElement('span');
        hexEl.className = 'lf-hex';
        hexEl.textContent = values[spec.name];
        colorRow.append(input, hexEl);
        row.appendChild(colorRow);
      } else if (spec.type === 'select') {
        input = document.createElement('select');
        for (const opt of spec.options) {
          const o = document.createElement('option');
          o.value = opt;
          o.textContent = opt;
          input.appendChild(o);
        }
        input.value = values[spec.name];
        row.append(head, input);
      } else {
        readoutEl = document.createElement('span');
        readoutEl.className = 'lf-readout';
        readoutEl.textContent = formatNumber(spec, values[spec.name]);
        head.appendChild(readoutEl);
        input = document.createElement('input');
        input.type = 'range';
        input.min = spec.min;
        input.max = spec.max;
        input.step = spec.step;
        input.value = values[spec.name];
        row.append(head, input);
        setRangeFill(input, spec, values[spec.name]);
      }
    }

    // Thin adapter: read the raw DOM value and hand it to setValue. It must
    // not touch values/onChange/persistence itself — setValue is the only
    // write path (see above).
    input.addEventListener('input', () => {
      const v = spec.type === 'checkbox' ? input.checked
        : (spec.type === 'color' || spec.type === 'select') ? input.value
        : parseFloat(input.value);
      setValue(spec.name, v);
    });

    controllers[spec.name] = {
      render(v) {
        if (spec.type === 'checkbox') { input.checked = v; return; }
        input.value = v;
        if (readoutEl) readoutEl.textContent = formatNumber(spec, v);
        if (hexEl) hexEl.textContent = v;
        if (spec.type !== 'color' && spec.type !== 'select') setRangeFill(input, spec, v);
      },
      setRowVisible(visible) {
        row.style.display = visible ? '' : 'none';
      },
    };

    if (spec.name === 'colorMode') enhanceColorModeToggle(row, input, spec);

    sectionOf(spec).appendChild(row);
  }

  // Presets are the same operation the reset button already performed: write
  // every control, update its input, fire onChange, persist. The only
  // difference is which map is written. Composing over `defaults` is what
  // makes a partial preset safe — a control the preset omits lands on the
  // piece's own default rather than keeping the previous preset's value.
  function applyValues(map) {
    const next = { ...defaults, ...map };
    for (const spec of allSpecs) setValue(spec.name, next[spec.name], { persist: false });
    // setValue(colorA/colorB, ...) above may have just overwritten hue/hueB
    // with a lossy hex decode — order-dependent otherwise, since 'hidden'
    // specs are plain entries in the same allSpecs array. The exact value
    // `next` already carries always wins on a programmatic write (preset,
    // Reset, ?preset= on load): reassert it directly, no side effects, so
    // these paths render at exactly the declared number, never an
    // approximation of it.
    for (const spec of allSpecs) {
      if (spec.kind === 'hidden') values[spec.name] = next[spec.name];
    }
    persist();
  }

  const presetNames = Object.keys(presets);
  let chipRow = null;
  const chips = {};

  function setActiveChip(name) {
    for (const [n, el] of Object.entries(chips)) {
      el.setAttribute('aria-pressed', String(n === name));
    }
  }

  if (presetNames.length) {
    chipRow = document.createElement('div');
    chipRow.className = 'lf-presets';
    for (const name of presetNames) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'lf-chip';
      chip.dataset.preset = name;
      chip.textContent = name;
      chip.setAttribute('aria-pressed', 'false');
      chip.addEventListener('click', () => {
        applyValues(presets[name]);
        setActiveChip(name);
      });
      chips[name] = chip;
      chipRow.appendChild(chip);
    }
    // Presets sit above every section, ahead of the two tiers built earlier
    // in this function — insertBefore rather than appendChild, since the
    // section containers are already in `body` by this point.
    body.insertBefore(chipRow, secInteraction.el);
  }

  for (const spec of allSpecs) buildRow(spec);
  // colorB's row only makes sense in gradient mode; setValue toggles it on
  // every subsequent change, this sets the correct initial state.
  controllers.colorB?.setRowVisible?.(values.colorMode === 'gradient');

  // Reset is a sticky footer (fix round 1, finding 1): a sibling of `body`,
  // not a child of it, so the flex layout in PANEL_CSS keeps it pinned to
  // the panel's bottom edge regardless of how far `body` is scrolled. Still
  // inside `panel`, which carries `data-lf-panel` — the hard constraint is
  // about that attribute, not about which direct child holds a row.
  const resetBtn = document.createElement('button');
  resetBtn.className = 'lf-reset';
  resetBtn.textContent = 'Reset to defaults';
  resetBtn.addEventListener('click', () => {
    applyValues(defaults);
    setActiveChip(null);
  });
  panel.appendChild(resetBtn);

  document.body.appendChild(panel);

  function applyPanelPosition() {
    if (window.innerWidth <= 640 || !panelPosition) {
      panel.style.removeProperty('left');
      panel.style.removeProperty('top');
      panel.style.removeProperty('right');
      panel.style.removeProperty('bottom');
      return;
    }
    const maxLeft = Math.max(0, window.innerWidth - panel.offsetWidth);
    const maxTop = Math.max(0, window.innerHeight - panel.offsetHeight);
    panelPosition.left = Math.min(maxLeft, Math.max(0, panelPosition.left));
    panelPosition.top = Math.min(maxTop, Math.max(0, panelPosition.top));
    panel.style.left = `${panelPosition.left}px`;
    panel.style.top = `${panelPosition.top}px`;
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
  }
  applyPanelPosition();
  window.addEventListener('resize', applyPanelPosition);

  function persist() {
    if (isPreview) return;
    localStorage.setItem(storageKey, JSON.stringify({ collapsed, values, sections: sectionOpen, position: panelPosition }));
  }

    // canvas draw calls and exported paths share the same coordinates for —

    // or beyond the near plane there is no meaningful projection; scale 0
    // is the caller's signal to skip this point.
    const nearPlane = opt.fov * 0.2;

      for (const n of members.values()) if (n === name) return true;
      return false;
    },

    /** Joins the current. Publish through the returned handle, and `leave()`
     * when torn down: that clears whatever this member had published. */
    join(name) {
      const id = nextId++;
      members.set(id, String(name));
      listen();
      return {
        name: String(name),
        /** True while a member with another name is on the page. A member
         * that is alone should behave as if there were no current. */
        get accompanied() {
          for (const [other, n] of members) if (other !== id && n !== name) return true;
          return false;
        },
        /** Sets a channel (see the list at the top), or clears it with null.
         * The last publisher owns the channel. */
        publish(channel, value) {
          if (!CURRENT_CHANNELS.includes(channel) || !members.has(id)) return;
          if (value == null) {
            if (owners[channel] === id) { current[channel] = null; delete owners[channel]; }
            return;
          }
          current[channel] = value;
          owners[channel] = id;
        },
        leave() {
          if (!members.delete(id)) return;
          for (const channel of CURRENT_CHANNELS) {
            if (owners[channel] === id) { current[channel] = null; delete owners[channel]; }
          }
          listen();
        },
      };
    },

    /** What the cursor alone does at a point: adds to `out` ([vx, vy], y down)
     * and returns it. Push, Attract and Vortex move things; the other modes
     * break a form apart where it stands and add nothing here. */
    cursorAt(x, y, out) {
      const cursor = current.cursor;
      const p = current.pointer;
      if (!cursor || !p.active || !(cursor.reach > 0)) return out;
      const mode = cursor.mode;
      if (mode !== 'push' && mode !== 'attract' && mode !== 'vortex') return out;
      const dx = x - p.x, dy = y - p.y;
      const d2 = dx * dx + dy * dy;
      const fall = Math.exp(-d2 / (cursor.reach * cursor.reach)) * (cursor.strength ?? 1);
      if (fall < 1e-3) return out;
      const d = Math.sqrt(d2) || 1;
      const ax = dx / d, ay = dy / d; // away from the cursor
      if (mode === 'push') { out[0] += ax * fall; out[1] += ay * fall; }
      else if (mode === 'attract') {
        const near = Math.min(1, d / (cursor.reach * 0.3)); // settle at the cursor, don't overshoot
        out[0] -= ax * fall * near; out[1] -= ay * fall * near;
      } else { // vortex: around the cursor, drawn slightly in
        out[0] += (ay * 0.75 - ax * 0.15) * fall;
        out[1] += (-ax * 0.75 - ay * 0.15) * fall;
      }
      return out;
    },

    /** The flow at a point: the published field plus what the cursor does
     * there. Lines and particles that both follow this move together.
     * `t` is `now()`; a publisher that animates on its own clock may ignore
     * it. Writes into and returns `out`. */
    flowAt(x, y, t, out) {
      out[0] = 0; out[1] = 0;
      const field = current.field;
      if (field) field.sample(x, y, t, out);
      return current.cursorAt(x, y, out);
    },
  };

  // One pointer for the page, tracked only while there is company: an overlay
  // on top of a canvas would otherwise hide the cursor from whatever is under it.
  function onMove(e) { const p = current.pointer; p.x = e.clientX; p.y = e.clientY; p.active = true; }
  function onGone() { current.pointer.active = false; }
  function listen() {
    if (typeof addEventListener !== 'function') return;
    const want = new Set(members.values()).size > 1;
    if (want === listening) return;
    listening = want;
    if (want) {
      addEventListener('pointermove', onMove, { passive: true });
      addEventListener('pointerdown', onMove, { passive: true });
      addEventListener('blur', onGone);
      document.documentElement.addEventListener('pointerleave', onGone);
    } else {
      removeEventListener('pointermove', onMove);
      removeEventListener('pointerdown', onMove);
      removeEventListener('blur', onGone);
      document.documentElement.removeEventListener('pointerleave', onGone);
      current.pointer.active = false;
    }
  }

  return current;
}

/** The page's one current. Another copy of this file, loaded by something
 * else on the page, returns the same object. */
function pageCurrent() {
  const existing = globalThis[CURRENT_KEY];
  if (existing) {
    // A different version is a different contract: don't half-understand it.
    return existing.version === CURRENT_VERSION ? existing : createCurrent();
  }
  const made = createCurrent();
  Object.defineProperty(globalThis, CURRENT_KEY, { value: made, configurable: true });
  return made;
}

// shared/companion.js
// A piece's side of the page current (shared/current.js): what a piece needs
// when a Forma object shares its page. Everything here works in the piece's
// own canvas pixels; the current itself speaks viewport pixels.
//
// Alone on a page (every gallery page, thumbnail, and plain baked export)
// `step()` returns null, nothing is published, and the piece must draw
// exactly what it draws without this module.

function createCompanion({ canvas }) {
  const current = pageCurrent();
  const me = current.join('linefield');
  // Canvas px = (client px - origin) * scale.
  const map = { left: 0, top: 0, sx: 1, sy: 1 };
  // The object in the field, eased so it arrives and leaves without a snap.
  const body = { x: 0, y: 0, r: 0, disperse: 0, form: 'solid', presence: 0 };
  const scratch = [0, 0];
  let lastT = 0;
  let published = false;

  function measure() {
    const r = canvas.getBoundingClientRect();
    map.left = r.left; map.top = r.top;
    map.sx = r.width ? canvas.width / r.width : 1;
    map.sy = r.height ? canvas.height / r.height : 1;
  }

  return {
    /** Call first thing every frame. Returns the object sharing the page, in
     * canvas px ({ x, y, r, disperse, form, presence 0..1 }), or null when
     * the piece is alone. */
    step() {
      const now = performance.now();
      const dt = lastT ? Math.min((now - lastT) / 1000, 0.1) : 0;
      lastT = now;
      const there = me.accompanied ? current.body : null;
      if (!there && body.presence <= 0) return null;
      measure();
      const k = Math.min(1, dt * 5);
      if (there) {
        const x = (there.x - map.left) * map.sx, y = (there.y - map.top) * map.sy, r = there.r * map.sx;
        if (body.presence <= 0) { body.x = x; body.y = y; body.r = r; body.disperse = there.disperse; }
        else {
          body.x += (x - body.x) * k; body.y += (y - body.y) * k; body.r += (r - body.r) * k;
          body.disperse += (there.disperse - body.disperse) * Math.min(1, dt * 8);
        }
        body.form = there.form;
      }
      body.presence += ((there ? 1 : 0) - body.presence) * Math.min(1, dt * 2.5);
      if (!there && body.presence < 0.002) { body.presence = 0; return null; }
      return body;
    },

    /** Publishes this piece's flow while it has company: `fn(x, y, out)` in
     * canvas px, writing a direction of length 0..1 into `out`. */
    field(fn) {
      if (!me.accompanied) {
        if (published) { me.publish('field', null); me.publish('palette', null); published = false; }
        return;
      }
      if (published) return;
      published = true;
      me.publish('field', {
        sample(x, y, t, out) {
          fn((x - map.left) * map.sx, (y - map.top) * map.sy, out);
          return out;
        },
      });
    },

    /** Publishes the piece's two colour stops ([r, g, b] 0..255). */
    palette(a, b, dark, name = null) {
      if (!me.accompanied) return;
      const p = current.palette;
      if (p && p.owner === me && p.a[0] === a[0] && p.a[1] === a[1] && p.a[2] === a[2]
        && p.b[0] === b[0] && p.b[1] === b[1] && p.b[2] === b[2] && p.dark === dark) return;
      me.publish('palette', { a: [...a], b: [...b], dark, name, owner: me });
    },

    /** What the cursor does at a canvas point, as a direction of length 0..1
     * (zero when alone). Returns a shared scratch array: read it at once. */
    cursor(x, y) {
      scratch[0] = 0; scratch[1] = 0;
      if (!me.accompanied) return scratch;
      return current.cursorAt(x / map.sx + map.left, y / map.sy + map.top, scratch);
    },

    destroy() { me.leave(); },
  };
}


// --- piece script ---







  // funnel — a funnel seen from the side: ninety stacked hairline
  // ellipses narrowing down to a point, slowly twisting, with the tip as the
  // one bright anchor.
  //
  // Text-safe zone (default framing): the left quarter of the frame; the left
  // third at Scale 1. The funnel stands in the
  // central square, a little right of centre, mouth up, tip down.
  // Anchor: the tip, lower centre. It is not drawn as a glow: the smallest
  // rings stack on top of each other there and brighten additively.
  //
  // Each ring is an ellipse (not a circle) in its own cross-section, and the
  // ellipse's long axis turns with depth (Twist) and with time, so the
  // silhouette reads as a twisting column rather than a solid of revolution.
  // The asymmetry is also what keeps Yaw and Phase visible: a circular
  // stack would look identical from every yaw.
  const PIECE_ID = 'funnel';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Ring count derives per frame from density — no persistent array.
  const BASE_RINGS = 90;
  const SEG = 120;          // segments per ring
  const ECC = 0.72;         // cross-section minor/major axis ratio
  const SPIN_PERIOD = 14;   // seconds per full turn of the twist at speed 1
  const SWAY_PERIOD = 11;   // seconds per sway cycle (Motion's gesture)
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 0.55, stroke: 0.6, density: 0.5, flare: 0.8, glow: 0 },
    ink:     { opacity: 1, stroke: 1.35, density: 0.85, twist: 0.6, glow: 0, rotX: 12 },
    neon:    { opacity: 0.9, stroke: 0.9, density: 1.1, saturation: 0.9, glow: 1.1 },
    drift:   { opacity: 0.7, stroke: 0.8, density: 0.8, speed: 0.4, motion: 1.8, twist: 1.6, flare: 1.4 },
    dense:   { opacity: 0.85, stroke: 0.9, density: 1.7, glow: 0.5, flare: 1.3, rotX: 24 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      { name: 'flare', label: 'Flare', type: 'range', min: 0, max: 2, step: 0.01, default: 1, category: 'visual' },
      { name: 'twist', label: 'Twist', type: 'range', min: 0, max: 2, step: 0.01, default: 1, category: 'visual' },
      { name: 'rotX', label: 'Pitch', type: 'range', min: -90, max: 90, step: 1, default: 24, category: 'interaction' },
      { name: 'rotY', label: 'Yaw', type: 'range', min: -180, max: 180, step: 1, default: 0, category: 'interaction' },
    ],
    defaults: { hue: 290, hueB: 190, saturation: 0, scale: 1.5, colorMode: 'gradient', colorA: '#aa00ff', colorB: '#00aaff' },
  });
  const currentValues = baked || panel.values;
  const clampDeg = (n, min, max) => Math.max(min, Math.min(max, n));
  // In panel mode the drag writes straight into rotX/rotY through setValue —
  // the only write path — so the Pitch/Yaw sliders and the rendered camera
  // never disagree. A baked export has no panel to write through, so it
  // mutates currentValues directly, clamped to the same ranges the panel
  // would have enforced.
  const orbit = createOrbit({
    canvas,
    onOrbit: (dPitch, dYaw) => {
      const dPitchDeg = (dPitch * 180) / Math.PI;
      const dYawDeg = (dYaw * 180) / Math.PI;
      if (panel) {
        panel.setValue('rotX', panel.values.rotX + dPitchDeg, { persist: false });
        panel.setValue('rotY', panel.values.rotY + dYawDeg, { persist: false });
      } else {
        currentValues.rotX = clampDeg(currentValues.rotX + dPitchDeg, -90, 90);
        currentValues.rotY = clampDeg(currentValues.rotY + dYawDeg, -180, 180);
      }
    },
    onSettle: () => {
      if (!panel) return;
      panel.setValue('rotX', panel.values.rotX, { persist: true });
      panel.setValue('rotY', panel.values.rotY, { persist: true });
    },
  });

  const camera = createCamera({ fov: 900 });

  // The page current (shared/current.js): when a Forma object shares the
  // page it hovers in the funnel's mouth, and the pull down the throat is
  // published so the object's matter is drawn into the well as it comes
  // apart. Alone, none of this runs.
  const companion = createCompanion({ canvas });
  const well = { mx: 0, my: 0, tx: 0, ty: 0, mouth: 1, flare: 1, turn: 1 }; // mouth and tip on screen
  let infall = 0; // extra spin accumulated while matter is falling in
  // The flow others on the page see: down the throat toward the tip,
  // spiralling the way the rings turn, strongest near the axis.
  function publishedFlow(x, y, out) {
    const ax = well.tx - well.mx, ay = well.ty - well.my;
    const len2 = ax * ax + ay * ay || 1;
    const sRaw = ((x - well.mx) * ax + (y - well.my) * ay) / len2;
    const s = Math.max(0, Math.min(1, sRaw));
    const px = well.mx + ax * s, py = well.my + ay * s;
    const off = Math.hypot(x - px, y - py);
    // The throat's own radius at this depth. Inside it, matter goes down the
    // axis; outside it (or above the mouth), it is first gathered to the
    // mouth, so nothing slides down the outside of the funnel.
    const throat = well.mouth * Math.pow(1 - s, well.flare) + well.mouth * 0.04;
    const inside = sRaw < 0 ? 0 : Math.max(0, Math.min(1, 1.6 - off / throat));
    const aim = Math.min(1, s + 0.3) * inside;
    let dx = well.mx + ax * aim - x, dy = well.my + ay * aim - y;
    const d = Math.hypot(dx, dy);
    if (d < 1e-3) { out[0] = 0; out[1] = 0; return; }
    dx /= d; dy /= d;
    const swirl = 0.5 * (1 - s) * inside * well.turn;
    const c = Math.cos(swirl), sn = Math.sin(swirl);
    const m = (0.35 + 0.65 * inside) * Math.min(1, d / (well.mouth * 0.15));
    out[0] = (dx * c - dy * sn) * m;
    out[1] = (dx * sn + dy * c) * m;
  }

  // Splits one projected ring into front and back runs. A point is "front"
  // when its perspective scale beats the ring centre's, so the near half of
  // every ellipse can draw brighter than the far half and the stack reads
  // as a solid. Runs also break at any point at or behind the near plane
  // (scale <= 0) instead of bridging it with a straight line.
  function ringRuns(pts, centreScale) {
    const front = [];
    const back = [];
    let run = [];
    let runFront = null;
    const flush = () => {
      if (run.length >= 2) (runFront ? front : back).push(run);
      run = [];
    };
    for (const p of pts) {
      if (p.scale <= 0) { flush(); runFront = null; continue; }
      const isFront = p.scale >= centreScale;
      if (runFront !== null && isFront !== runFront) {
        const seam = run[run.length - 1];
        flush();
        run.push(seam); // the next run starts where this one ended
      }
      runFront = isFront;
      run.push(p);
    }
    flush();
    return { front, back };
  }

  function strokeRuns(runs, alpha, lineWidth, rgb) {
    if (!runs.length || alpha <= 0) return;
    ctx.beginPath();
    for (const run of runs) {
      ctx.moveTo(run[0].x, run[0].y);
      for (let i = 1; i < run.length; i++) ctx.lineTo(run[i].x, run[i].y);
    }
    ctx.strokeStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${Math.min(1, alpha)})`;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }

  function drawFrame(dt, elapsed, values) {
    const W = canvas.width;
    const H = canvas.height;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, W, H);
    // Additive on the dark ground, so wherever rings stack the image
    // brightens on its own. On the light (inverted) ground `lighter` would
    // clip everything to white, so dark ink layers with plain alpha there.
    ctx.globalCompositeOperation = values.invert ? 'source-over' : 'lighter';
    // Butt caps: runs split at a shared point (alpha buckets), and round caps
    // would overlap there and add up to a bright bead under 'lighter'.
    ctx.lineCap = 'butt';

    paths = [];
    const S = Math.min(W, H);
    const size = 0.35 + 0.65 * values.scale;
    const height = S * 0.62 * size;
    const mouth = S * 0.3 * size;
    const rings = Math.max(10, Math.round(BASE_RINGS * values.density));
    // Silhouette exponent: below 1 the wall bulges like a bowl, 1 is a cone,
    // above 1 it pinches into a trumpet.
    const flareExp = 0.8 + values.flare * 0.9;
    const t = elapsed * values.speed;
    // An object on the page. As it comes apart the funnel turns faster and
    // a band of brightness runs down the throat: matter going in.
    const body = companion.step();
    const falling = body ? body.disperse * body.presence : 0;
    infall += (dt || 0) * values.speed * falling * 0.9;
    const spin = (t / SPIN_PERIOD) * Math.PI * 2 + infall;
    const twistTotal = values.twist * Math.PI * 1.25;
    const phaseOff = values.phase * Math.PI * 0.8;
    const swayAmp = S * 0.045 * values.motion * size;
    const swayT = (t / SWAY_PERIOD) * Math.PI * 2;
    const lean = S * 0.05 * size; // a fixed lean of the tip, so the form has a heading Yaw can turn
    const light = values.invert ? 0.14 : 0.9 - 0.28 * values.saturation;
    const lineWidth = 0.5 + values.stroke * 0.4;
    const baseAlpha = values.opacity * (values.invert ? 0.55 : 1);

    camera.set({
      tilt: (values.rotX * Math.PI) / 180,
      yaw: (values.rotY * Math.PI) / 180,
      roll: (values.angle * Math.PI) / 180,
      // Nudged right of centre so the mouth stays clear of the left third.
      cx: W / 2 + 0.06 * S,
      cy: H / 2,
    });

    // Axis centre at depth u (0 = mouth, 1 = tip): the fixed lean plus a
    // slow wave that travels down the column, growing toward the tip.
    const axisAt = (u) => {
      const w = u * u;
      return [
        lean * w + swayAmp * w * Math.sin(swayT - u * 2.2 + phaseOff),
        -height / 2 + height * u,
        swayAmp * 0.8 * w * Math.cos(swayT * 0.8 - u * 1.7 + phaseOff),
      ];
    };

    if (body) {
      // Slide the whole funnel so its mouth sits under the object, which
      // then rests in it like a stopper.
      const m0 = camera.project(...axisAt(0));
      const k = body.presence;
      camera.set({
        cx: W / 2 + 0.06 * S + (body.x - m0.x) * k,
        cy: H / 2 + (body.y + body.r * 0.7 - m0.y) * k,
      });
      const m = camera.project(...axisAt(0));
      const tp = camera.project(...axisAt(1));
      well.mx = m.x; well.my = m.y; well.tx = tp.x; well.ty = tp.y;
      well.mouth = Math.max(1, mouth * m.scale);
      well.turn = values.speed < 0 ? -1 : 1;
      well.flare = flareExp;
      companion.field(publishedFlow);
      const a = paletteHsl(values, 0), b = paletteHsl(values, 1);
      companion.palette(hslToRgb(a.h, a.s, light), hslToRgb(b.h, b.s, light), !values.invert);
    }
    const bandAt = (t * 0.22) % 1;

    let tip = null;
    for (let i = 0; i < rings; i++) {
      const x = i / (rings - 1);
      // Rings pile up toward the tip (spacing -> 0), which is what makes the
      // tip the brightest point without drawing a glow.
      const u = 1 - Math.pow(1 - x, 1.8);
      const R = mouth * Math.pow(1 - u, flareExp) + S * 0.0015 * size;
      // Differential spin: the lower rings turn faster, so the twist keeps
      // tightening and loosening instead of rotating as one rigid stack.
      const theta = spin * (0.6 + 0.8 * u) + twistTotal * u + phaseOff;
      const ct = Math.cos(theta);
      const st = Math.sin(theta);
      const [ax, ay, az] = axisAt(u);

      const pts = [];
      for (let s = 0; s <= SEG; s++) {
        const a = (s / SEG) * Math.PI * 2;
        const ex = Math.cos(a) * R;
        const ez = Math.sin(a) * R * ECC;
        pts.push([ax + ex * ct - ez * st, ay, az + ex * st + ez * ct]);
      }
      const centre = camera.project(ax, ay, az);
      if (i === rings - 1) tip = centre;
      const { front, back } = ringRuns(camera.projectPath(pts), centre.scale);
      for (const run of front) paths.push(run.map((p) => [p.x, p.y]));
      for (const run of back) paths.push(run.map((p) => [p.x, p.y]));

      const { h, s } = paletteHsl(values, u);
      const rgb = hslToRgb(h, s, light);
      let alphaFront = baseAlpha * (0.7 + 0.3 * u);
      if (falling > 0) {
        const off = Math.abs(((u - bandAt + 1.5) % 1) - 0.5);
        alphaFront *= 1 + 0.9 * falling * Math.max(0, 1 - off / 0.12);
      }
      if (values.glow > 0) {
        strokeRuns(front, alphaFront * values.glow * 0.2, lineWidth + values.glow * 2.2, rgb);
      }
      strokeRuns(back, alphaFront * 0.7, lineWidth, rgb);
      strokeRuns(front, alphaFront, lineWidth, rgb);
    }

    // Glow is a fallback for the anchor, off by default: the tip is already
    // the brightest point from the stacked rings alone.
    if (values.glow > 0 && tip && tip.scale > 0) {
      const { h, s } = paletteHsl(values, 1);
      const [r, g, b] = hslToRgb(h, s, light);
      const gr = (10 + 26 * values.glow) * size;
      const grad = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, gr);
      grad.addColorStop(0, `rgba(${r},${g},${b},${Math.min(1, 0.5 * values.glow * values.opacity)})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, gr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values })
      .catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
