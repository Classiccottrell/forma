# Builds the library (dist/) then app/ (app/dist/) and publishes app/dist/ to
# GitHub Pages. Requires repo Settings -> Pages -> Source = "GitHub Actions".
#
# UNVERIFIED beyond local YAML syntax validation (`python3 -c "import yaml..."`)
# — no live GitHub Actions runner was available to actually execute this
# workflow. Review before relying on it in production.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build library
        run: |
          npm ci
          npm run build
      - name: Install and build app
        working-directory: app
        env:
          # ${{ github.event.repository.name }} == the repo's own name, so this
          # resolves correctly for a project Pages site without hardcoding it.
          FORMA_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
